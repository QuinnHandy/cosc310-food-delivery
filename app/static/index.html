<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Restaurants</title>
    <link rel="icon" href="data:,">
    <style>
        .unavailable { color: #777; }
        #cart { border: 1px solid #ccc; padding: 0 1em 1em; margin-top: 1em; }
        .cart-totals td:first-child { padding-right: 1em; }
    </style>
</head>

<body>
    <h1>Restaurants</h1>
    <p id="session-bar"></p>
    <p><a href="/owner">Restaurant owner? Manage restaurants</a></p>

    <form id="search-form">
        <label>Name:
            <input type="text" id="search-name" placeholder="e.g. spice">
        </label>
        <label>Cuisine:
            <select id="search-cuisine">
                <option value="">All cuisines</option>
            </select>
        </label>
        <button type="submit">Search</button>
        <button type="button" id="search-clear">Clear</button>
    </form>

    <p id="status"></p>

    <ul id="restaurant-list"></ul>

    <section id="details" hidden>
        <h2 id="details-name"></h2>
        <p>Cuisine: <span id="details-cuisine"></span></p>
        <p>Restaurant ID: <span id="details-id"></span></p>

        <h3>Menu</h3>
        <p id="menu-status" role="status"></p>
        <ul id="menu-list"></ul>
    </section>

    <section id="cart">
        <h2>Your cart</h2>
        <p id="cart-status" role="status"></p>
        <ul id="cart-list"></ul>
        <table class="cart-totals" id="cart-totals" hidden>
            <tr><td>Subtotal</td><td id="cart-subtotal"></td></tr>
            <tr><td>Delivery fee</td><td id="cart-delivery-fee"></td></tr>
            <tr><td><strong>Total</strong></td><td><strong id="cart-total"></strong></td></tr>
        </table>
        <p>
            <button type="button" id="cart-clear" hidden>Clear cart</button>
            <button type="button" id="cart-checkout" hidden>Checkout</button>
        </p>
        <p id="checkout-status" role="status"></p>
    </section>

    <section id="order-confirmation" hidden>
        <h2>Order placed</h2>
        <div id="order-confirmation-body"></div>
        <p><a href="/orders">See all my orders</a></p>
    </section>

    <script src="/static/api.js"></script>
    <script src="/static/session.js"></script>
    <script src="/static/cart.js"></script>
    <script src="/static/order-view.js"></script>
    <script src="/static/checkout.js"></script>
    <script src="/static/app.js"></script>
</body>

</html>
