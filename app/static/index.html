<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Restaurants</title>
    <link rel="icon" href="data:,">
</head>

<body>
    <h1>Restaurants</h1>
    <p><a href="/owner">Restaurant owner? Manage restaurants</a></p>

    <form id="search-form">
        <label>Name:
            <input type="text" id="search-name" placeholder="e.g. spice">
        </label>
        <label>Cuisine:
            <select id="search-cuisine">
                <option value="">All cuisines</option>
            </select>
        </label>
        <button type="submit">Search</button>
        <button type="button" id="search-clear">Clear</button>
    </form>

    <p id="status"></p>

    <ul id="restaurant-list"></ul>

    <section id="details" hidden>
        <h2 id="details-name"></h2>
        <p>Cuisine: <span id="details-cuisine"></span></p>
        <p>Restaurant ID: <span id="details-id"></span></p>
    </section>

    <script src="/static/api.js"></script>
    <script src="/static/app.js"></script>
</body>

</html>
